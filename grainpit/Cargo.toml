[package]
name = "grainpit"
version = "0.3.0"
edition = "2024"
description = "tarpit to trap malicious scrapers"
license = "CC0-1.0"
repository = "https://github.com/GrainWare/grainpit"
readme = "../README.md"

[dependencies]
rand = "0.10.2"
regex = "1.13.0"
tracing.workspace = true
rustc-hash = "2.1.3"
arrayvec = "0.7.8"
rand_xoshiro = "0.8.1"
zune-image = { version = "0.5.0", default-features = false, features = [
    "jpeg",
] }
zune-core = "0.5.3"
minicbor-serde = { version = "0.7.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
#zune-imageprocs = "0.5.1" # disabled until zune gets their shit together and updates this package
