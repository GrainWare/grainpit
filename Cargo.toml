[workspace]
resolver = "3"
members = ["benchmarks", "grainpit", "grainpit_proxy", "grainpit_webserver"]

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "tarpit to trap malicious scrapers"
license = "CC0-1.0"
repository = "https://github.com/GrainWare/grainpit"

[workspace.dependencies]
tracing = "0.1.44"
tokio = { version = "1.53.0", features = ["full"] }

[profile.dev]
opt-level = 3
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = "thin"
panic = "unwind"
incremental = true
codegen-units = 16
rpath = false

[profile.release]
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"             # increased performance by ~20% in benchmarks
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.bench]
inherits = "release"
