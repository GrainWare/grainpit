[package]
name = "grainpit_webserver"
version = "0.3.0"
edition = "2024"
description = "tarpit to trap malicious scrapers"
license = "CC0-1.0"
repository = "https://github.com/GrainWare/grainpit"
readme = "../README.md"

[dependencies]
grainpit = { path = "../grainpit", version = "0.3.0" }
axum = "0.8.9"
axum-client-ip = "1.3.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = [
    "compression-br",
    "compression-gzip",
    "compression-deflate",
    "compression-zstd",
], optional = true }
chrono = "0.4.45"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
ipnet = "2.12.2"
reqwest = "0.13.5"

[features]
compress = ["dep:tower-http"]
