[package]
name = "grainpit_stats"
version = "0.1.0"
edition = "2024"
description = "statistics for grainpit"
license = "CC0-1.0"
repository = "https://github.com/GrainWare/grainpit"
readme = "../README.md"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
axum-client-ip = "1.3.1"
chrono = "0.4.45"
ipnet = "2.12.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnet",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio.workspace = true
tower-cookies = "0.11.0"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
grainpit = { path = "../grainpit", version = "0.3.0" }
